[unix_http_server]
file=/tmp/relay-supervisor.sock
chmod=0600

[supervisord]
nodaemon=true
pidfile=/tmp/relay-supervisord.pid
logfile=/dev/null
logfile_maxbytes=0
childlogdir=/tmp

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/relay-supervisor.sock

[eventlistener:container-failure]
command=/usr/local/bin/python /app/container-failure-listener.py
events=PROCESS_STATE_EXITED,PROCESS_STATE_FATAL
priority=1
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:relay-api]
command=/usr/local/bin/python /app/relay_api.py
directory=/app
priority=10
autostart=true
autorestart=false
startsecs=2
startretries=5
stopsignal=TERM
stopwaitsecs=50
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:relay-web]
command=/usr/sbin/nginx -g "daemon off;"
priority=20
autostart=true
autorestart=false
startsecs=2
startretries=5
stopsignal=QUIT
stopwaitsecs=10
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
