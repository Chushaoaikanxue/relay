worker_processes auto;
pid /tmp/relay-nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    client_body_temp_path /tmp/relay-client-body;
    proxy_temp_path /tmp/relay-proxy;
    fastcgi_temp_path /tmp/relay-fastcgi;
    uwsgi_temp_path /tmp/relay-uwsgi;
    scgi_temp_path /tmp/relay-scgi;

    server {
        listen 8080;
        server_name _;
        location = /relay { return 308 /relay/; }

        location ^~ /relay/api/ {
            proxy_pass http://127.0.0.1:18777;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 65s;
            client_max_body_size 64k;
        }

        location ^~ /relay/ {
            alias /usr/share/nginx/html/relay/;
            index index.html;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }
    }
}
